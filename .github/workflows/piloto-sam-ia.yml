name: SAM - laboratorio recurrente IA abierta
on:
  push:
    paths:
      - "sam/**"
      - "tests/**"
      - ".github/workflows/piloto-sam-ia.yml"
  workflow_dispatch:
    inputs:
      chain_step:
        description: "Etapa de ensayo GitHub; máximo 3 runs enlazados por activación"
        required: false
        type: string
        default: "0"
  schedule:
    # 4 rondas/día de pruebas de software, NO alquiler continuo de cómputo
    - cron: "23 2,8,14,20 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  # Main y laboratorio experimental no comparten cola; evita cancelación de pendientes.
  group: sam-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evoluciona-y-prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # En pruebas de rama no escribir en el mismo ledger que main.
      SAM_CANDIDATE_BRANCH: ${{ github.ref == 'refs/heads/main' && 'sam-candidates' || 'sam-r008-candidates' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Tests del software y amplitud curricular
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m sam.worker --dry-run
      - name: Recuperar experiencias previas aisladas (NO canon)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sam-state resultados
          git fetch --no-tags --depth=1 origin refs/heads/$SAM_CANDIDATE_BRANCH:refs/remotes/origin/$SAM_CANDIDATE_BRANCH
          if git cat-file -e origin/$SAM_CANDIDATE_BRANCH:state/eventos.jsonl 2>/dev/null; then
            git show origin/$SAM_CANDIDATE_BRANCH:state/eventos.jsonl > .sam-state/importar-eventos.jsonl
            python3 -m sam.quality .sam-state/importar-eventos.jsonl
            echo "RECUPERADO_HISTORIAL_VALIDADO $(wc -l < .sam-state/importar-eventos.jsonl)"
          fi
      - uses: actions/cache@v4
        with:
          key: sam-llama-b12483-qwen-small-v2
          path: runtime
      - name: Preparar llama.cpp CPU y modelos GGUF fijados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/modelos
          if test ! -e runtime/llama.tar.gz; then
            curl -fLsS --retry 2 --max-time 180 \
              https://github.com/ggml-org/llama.cpp/releases/download/b12483/llama-b12483-bin-ubuntu-x64.tar.gz \
              -o runtime/llama.tar.gz
          fi
          echo "41a1d0df0abbec1c48b506f347781e4b3d10f74423f0b6359f8b277df7e09a0a  runtime/llama.tar.gz" | sha256sum -c -
          if ! find runtime -type f -name llama-cli | grep -q .; then
            tar -xzf runtime/llama.tar.gz -C runtime
          fi
          CLI=$(find runtime -type f -name llama-cli | head -n 1)
          test -n "$CLI"
          chmod +x "$CLI"
          echo "LLAMA_BIN=$CLI" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$CLI")" >> "$GITHUB_ENV"
          if test ! -e runtime/modelos/qwen3.gguf; then
            curl -fLsS --retry 2 --max-time 360 \
              https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf \
              -o runtime/modelos/qwen3.gguf
          fi
          if test ! -e runtime/modelos/qwen25.gguf; then
            curl -fLsS --retry 2 --max-time 360 \
              https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
              -o runtime/modelos/qwen25.gguf
          fi
          echo "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4  runtime/modelos/qwen3.gguf" | sha256sum -c -
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  runtime/modelos/qwen25.gguf" | sha256sum -c -
          "$CLI" --version
      - name: SAM - experimentos variados y comparacion de estrategias
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python3 -m sam.worker \
            --model-a runtime/modelos/qwen3.gguf \
            --model-b runtime/modelos/qwen25.gguf \
            --llama-cli "$LLAMA_BIN" \
            --state .sam-state --reports resultados \
            --batch 14 --holdout-cases 2 --research-topics 3 --diverse --strategy-cases 2 --self-evolve-cases 2 --max-cycles 2 --interval 0 --min-free-gb 1.0
          python3 -m sam.quality .sam-state/eventos.jsonl --manifest .sam-state/ledger-manifest.json
      - name: Archivo durable en rama sam-candidates, no en main ni en TCSA
        shell: bash
        run: |
          set -euo pipefail
          test -s .sam-state/eventos.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add -B "$SAM_CANDIDATE_BRANCH" /tmp/sam-candidates "origin/$SAM_CANDIDATE_BRANCH"
          mkdir -p /tmp/sam-candidates/state /tmp/sam-candidates/runs /tmp/sam-candidates/auto-propuestas
          cp .sam-state/eventos.jsonl /tmp/sam-nuevos-eventos.jsonl
          cp resultados/sam-*.json /tmp/
          cd /tmp/sam-candidates
          test ! -f state/eventos.jsonl || test "$(stat -c %s state/eventos.jsonl)" -lt 104857600
          cat /tmp/sam-nuevos-eventos.jsonl >> state/eventos.jsonl
          for f in /tmp/sam-*.json; do
            test -f "$f" || continue
            cp "$f" runs/
          done
          for f in "$GITHUB_WORKSPACE"/resultados/auto-propuestas/*.json "$GITHUB_WORKSPACE"/resultados/auto-propuestas/*.py; do
            if test -f "$f"; then
              cp "$f" auto-propuestas/
            fi
          done
          (cd "$GITHUB_WORKSPACE" && python3 -m sam.quality /tmp/sam-candidates/state/eventos.jsonl --manifest /tmp/sam-candidates/state/ledger-manifest.json)
          git add state/eventos.jsonl state/ledger-manifest.json runs/ auto-propuestas/
          git commit -m "SAM: experiencias candidatas GitHub run $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$SAM_CANDIDATE_BRANCH"
          echo "CANDIDATOS_PUBLICADOS_NO_CANONICOS: $GITHUB_RUN_ID"
      - name: Artefactos de continuidad (no canon, 90 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-lote-candidatos
          path: |
            resultados/*.json
            .sam-state/eventos.jsonl
            .sam-state/ledger-manifest.json
            resultados/auto-propuestas/*.json
            resultados/auto-propuestas/*.py
          if-no-files-found: warn
          retention-days: 90

      - name: Siguiente ejecución GitHub después de archivar (con cuota de CI)
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_STEP: ${{ inputs.chain_step || '0' }}
        run: |
          set -euo pipefail
          NEXT="$(python3 -m sam.chain --current "$CHAIN_STEP" --limit 3)"
          if [ "$NEXT" = "STOP" ]; then
            echo "SAM_CHAIN_BUDGET_COMPLETE: hasta próximo disparador schedule/manual, no 24/7"
            exit 0
          fi
          echo "SAM_CHAIN_REQUESTED current=$CHAIN_STEP next=$NEXT"
          PAYLOAD="$(jq -nc --arg step "$NEXT" '{ref:"main",inputs:{chain_step:$step}}')"
          CODE="$(curl --silent --show-error --location --retry 2 --max-time 30 --output /tmp/sam-dispatch-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/piloto-sam-ia.yml/dispatches")"
          if [ "$CODE" != "204" ]; then
            echo "SAM_CHAIN_DISPATCH_FAILED: status=$CODE (sin reintento infinito)"
            cat /tmp/sam-dispatch-response.json || true
            exit 1
          fi
          echo "SAM_CHAIN_DISPATCH_ACCEPTED: next=$NEXT (GitHub la pone en cola)"
