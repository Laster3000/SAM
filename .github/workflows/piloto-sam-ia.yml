name: SAM - piloto IA dual gratuito
on:
  push:
    paths:
      - "sam/**"
      - "tests/**"
      - ".github/workflows/piloto-sam-ia.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: sam-duelo-gratuito
  cancel-in-progress: true
jobs:
  prueba-y-evolucion-candidata:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Contratos locales sin modelos
        run: python3 -m unittest discover -s tests -v
      - name: Descargar llama.cpp CPU de release pública fijada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl -fLsS --retry 2 --max-time 180 \
            https://github.com/ggml-org/llama.cpp/releases/download/b12483/llama-b12483-bin-ubuntu-x64.tar.gz \
            -o runtime/llama.tar.gz
          tar -xzf runtime/llama.tar.gz -C runtime
          CLI=$(find runtime -type f -name llama-cli | head -n 1)
          test -n "$CLI"
          chmod +x "$CLI"
          echo "LLAMA_BIN=$CLI" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$CLI")" >> "$GITHUB_ENV"
          "$CLI" --version
      - name: Descargar 2 GGUF abiertos y pequeños (menos de 1 GB juntos)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/modelos
          curl -fLsS --retry 2 --max-time 360 \
            https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf \
            -o runtime/modelos/qwen3.gguf
          curl -fLsS --retry 2 --max-time 360 \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            -o runtime/modelos/qwen25.gguf
          test "$(stat -c %s runtime/modelos/qwen3.gguf)" -gt 100000000
          test "$(stat -c %s runtime/modelos/qwen25.gguf)" -gt 100000000
          sha256sum runtime/modelos/*.gguf
      - name: Ejecutar SAM con dos modelos reales
        env:
          OMP_NUM_THREADS: "2"
        run: |
          mkdir -p resultados
          python3 -m sam.pilot --mode evolucion --limit 2 --max-tokens 96 \
            --llama-cli "$LLAMA_BIN" \
            --model-a runtime/modelos/qwen3.gguf \
            --model-b runtime/modelos/qwen25.gguf \
            --out resultados/sam-piloto.json
      - name: Resultados candidatos pendientes de TCSA3000
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-candidatos-no-canonicos
          path: resultados/*.json
          if-no-files-found: warn
          retention-days: 7
